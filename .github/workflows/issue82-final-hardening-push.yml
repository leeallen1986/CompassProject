name: Run Issue 82 anchored hardening on branch

on:
  push:
    branches:
      - agent/issue82-current-mailbox-evidence
    paths:
      - ".github/workflows/issue82-final-hardening-push.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue82-current-mailbox-evidence
          fetch-depth: 0
      - name: Execute staged anchored patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path(".github/workflows/issue82-final-hardening.yml").read_text().splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index("          PY", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          )
          exact_call = 'lusha = replace_once(lusha, old_flow, new_flow, "Lusha atomic confidence flow")'
          anchored_call = '''flow_start = lusha.index(
    "      const lushaResult = await lushaPersonLookup(firstName, lastName, contact.company, contactLinkedinUrl);"
)
flow_end = lusha.index("      await sleep(DELAY_BETWEEN_CALLS_MS);", flow_start)
lusha = lusha[:flow_start] + new_flow + "\n" + lusha[flow_end:]'''
          if script.count(exact_call) != 1:
              raise SystemExit("Staged Lusha replacement call was not unique")
          script = script.replace(exact_call, anchored_call, 1)
          exec(compile(script, "issue82-final-hardening.py", "exec"), {})
          PY
      - name: Commit production and regression changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/apolloEnrichment.ts \
            server/lushaEnrichment.ts \
            server/waterfall.structural.test.ts \
            server/contactTrustPromotionBoundary.test.ts \
            server/lushaEnrichment.test.ts
          git commit -m "fix(issue82): require current mailbox verification evidence"
          git push origin HEAD:agent/issue82-current-mailbox-evidence
