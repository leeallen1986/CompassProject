name: Issue 86 Phase 2A TiDB compatibility

on:
  pull_request:
    paths:
      - "drizzle/0091_issue86_buyer_route_evidence.sql"
      - "scripts/issue86-phase2a-tidb-0091-rehearsal.mjs"
      - "scripts/issue86-phase2a-tidb-preflight-core.mjs"
      - "scripts/issue86-phase2a-tidb-preflight-policy.mjs"
      - "scripts/issue86-phase2a-production-tidb-preflight-v2.mjs"
      - "scripts/issue86-phase2a-production-tidb-preflight.test.mjs"
      - ".github/workflows/issue-86-phase2a-tidb-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TiDB preflight source and unit gates
        run: |
          set -euo pipefail
          node --check scripts/issue86-phase2a-tidb-0091-rehearsal.mjs
          node --check scripts/issue86-phase2a-tidb-preflight-core.mjs
          node --check scripts/issue86-phase2a-tidb-preflight-policy.mjs
          node --check scripts/issue86-phase2a-production-tidb-preflight-v2.mjs
          node --test scripts/issue86-phase2a-production-tidb-preflight.test.mjs
          test "$(sha256sum drizzle/0091_issue86_buyer_route_evidence.sql | awk '{print $1}')" = "d6b76795819387a012768978403156b3b1b7f70fd129cbfe1484d052bf7346c4"
      - name: Pull digest-pinned TiDB 8.5.3 image
        run: |
          set -euo pipefail
          IMAGE='pingcap/tidb@sha256:00f015520ce91734c3fbec720f23448e790e691655c7e181544a620872a00c61'
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')" = \
            'pingcap/tidb@sha256:00f015520ce91734c3fbec720f23448e790e691655c7e181544a620872a00c61'
          docker image inspect "$IMAGE" --format '{{.Id}}'
      - name: Start disposable TiDB 8.5.3
        run: |
          set -euo pipefail
          IMAGE='pingcap/tidb@sha256:00f015520ce91734c3fbec720f23448e790e691655c7e181544a620872a00c61'
          docker run --detach \
            --name issue86-tidb-853 \
            --publish 127.0.0.1:4000:4000 \
            "$IMAGE" \
            --store=unistore \
            --path=/tmp/issue86-tidb \
            --host=0.0.0.0 \
            -P 4000
          for attempt in $(seq 1 90); do
            if node --input-type=module <<'NODE'
          import { createConnection } from 'mysql2/promise';
          try {
            const connection = await createConnection({
              host: '127.0.0.1',
              port: 4000,
              user: 'root',
              password: '',
              connectTimeout: 1000,
            });
            const [[row]] = await connection.query('SELECT VERSION() AS versionString');
            await connection.end();
            if (!String(row.versionString).startsWith('8.0.11-TiDB-v8.5.3')) {
              process.exit(2);
            }
          } catch {
            process.exit(1);
          }
          NODE
            then
              exit 0
            fi
            sleep 2
          done
          docker logs issue86-tidb-853
          exit 1
      - name: Apply and prove 0091 behavior
        run: |
          set -euo pipefail
          node scripts/issue86-phase2a-tidb-0091-rehearsal.mjs \
            | tee "$RUNNER_TEMP/issue86-tidb-0091-rehearsal.json"
      - name: Upload rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue86-tidb-0091-rehearsal
          path: ${{ runner.temp }}/issue86-tidb-0091-rehearsal.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop disposable TiDB
        if: always()
        run: docker rm --force issue86-tidb-853 2>/dev/null || true
