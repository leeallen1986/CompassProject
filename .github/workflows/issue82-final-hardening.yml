          boundary = replace_once(boundary, old_lusha_test, new_lusha_test, "Lusha confidence inventory assertion")

          census_test = '''
  it("finds no unenumerated raw send-ready persistence writer", () => {
    const allowedRawWriters = new Set([
      "server/contactEnrichment.ts",
      "server/contactTrustReconciliation.ts",
      "server/contactValidationState.ts",
    ]);
    const hits: string[] = [];

    for (const root of ["server", "scripts"]) {
      for (const path of sourceFiles(root)) {
        if (/\.test\.[^.]+$/.test(path)) continue;
        source(path).split(/\r?\n/).forEach((line, index) => {
          const trimmed = line.trim();
          if (trimmed.startsWith("//") || trimmed.startsWith("*")) return;
          if (
            /contactTrustTier\s*:\s*["']send_ready["']/.test(line) ||
            /contactTrustTier\s*=\s*["']send_ready["']/.test(line)
          ) {
            hits.push(`${path}:${index + 1}:${trimmed}`);
          }
        });
      }
    }

    expect(hits.filter(hit => !allowedRawWriters.has(hit.split(":", 1)[0]))).toEqual([]);
  });

'''
