          waterfall = replace_once(waterfall, old_fix4, new_fix4, "stale Apollo structural assertions")
          waterfall_path.write_text(waterfall)

          # Strengthen focused inventory checks and add a repository-wide raw-writer census.
          boundary_path = Path("server/contactTrustPromotionBoundary.test.ts")
          boundary = boundary_path.read_text()
          boundary = replace_once(
              boundary,
              'import { readFileSync } from "node:fs";\n'
              'import { resolve } from "node:path";\n',
              'import { readFileSync, readdirSync } from "node:fs";\n'
              'import { extname, join, relative, resolve } from "node:path";\n',
              "boundary census imports",
          )
          boundary = replace_once(
              boundary,
              'function source(path: string): string {\n'
              '  return readFileSync(resolve(process.cwd(), path), "utf8");\n'
              '}\n',
              'function source(path: string): string {\n'
              '  return readFileSync(resolve(process.cwd(), path), "utf8");\n'
              '}\n'
              '\n'
              'function sourceFiles(root: string): string[] {\n'
              '  const files: string[] = [];\n'
