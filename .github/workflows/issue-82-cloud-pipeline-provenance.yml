name: Issue 82 cloud pipeline provenance

on:
  pull_request:
    paths:
      - "pipeline-runner.ts"
      - "run-pipeline.sh"
      - "tsconfig.worker.json"
      - "scripts/cloud-pipeline-release-manifest.mjs"
      - "scripts/worker-validation-job.mjs"
      - "docs/CLOUD-PIPELINE-SETUP.md"
      - "docs/WORKER-CONTROL-CHANNEL.md"
      - ".github/workflows/issue-82-cloud-pipeline-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Build immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          node scripts/cloud-pipeline-release-manifest.mjs \
            --expected-sha "$HEAD_SHA" \
            --output /tmp/cloud-pipeline-release-manifest.json
          test -s /tmp/cloud-pipeline-release-manifest.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/cloud-pipeline-release-manifest.json", "utf8"));
            if (m.schemaVersion !== 2) throw new Error("unexpected manifest schema");
            if (!m.cleanWorkingTree) throw new Error("working tree not clean");
            if (!/^[a-f0-9]{64}$/.test(m.releaseTreeSha256)) throw new Error("invalid releaseTreeSha256");
            for (const path of [
              "pipeline-runner.ts",
              "run-pipeline.sh",
              "tsconfig.worker.json",
              "scripts/cloud-pipeline-release-manifest.mjs",
              "scripts/worker-validation-job.mjs",
              "docs/CLOUD-PIPELINE-SETUP.md",
              "docs/WORKER-CONTROL-CHANNEL.md",
              "server/dailyPipeline.ts",
              "server/pipelineExecutionSupervisor.ts",
              "server/pipelineRecovery.ts",
              "server/workerRecoveryGuard.ts",
              "server/contactEnrichment.ts",
            ]) {
              if (!m.criticalFiles[path]) throw new Error(`critical hash missing: ${path}`);
            }
            if (m.fileModes["run-pipeline.sh"] !== "100755") {
              throw new Error(`run-pipeline.sh must be executable in Git; mode=${m.fileModes["run-pipeline.sh"]}`);
            }
            if (m.fileModes["pipeline-runner.ts"] !== "100644") {
              throw new Error(`unexpected pipeline-runner.ts mode=${m.fileModes["pipeline-runner.ts"]}`);
            }
            for (const path of [
              "tsconfig.worker.json",
              "scripts/cloud-pipeline-release-manifest.mjs",
              "scripts/worker-validation-job.mjs",
              "docs/CLOUD-PIPELINE-SETUP.md",
              "docs/WORKER-CONTROL-CHANNEL.md",
            ]) {
              if (m.fileModes[path] !== "100644") {
                throw new Error(`unexpected worker release file mode for ${path}: ${m.fileModes[path]}`);
              }
            }
          '

      - name: Reject plaintext credential examples in runbooks
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE "sshpass[[:space:]]+-p[[:space:]]+[^<]|APOLLO_API_KEY.*\([^)]{8,}\)" \
            docs/CLOUD-PIPELINE-SETUP.md docs/WORKER-CONTROL-CHANNEL.md; then
            echo "Runbook appears to contain a plaintext credential or API key example." >&2
            exit 1
          fi
