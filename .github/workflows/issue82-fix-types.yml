name: Apply Issue 82 Hunter type correction

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/issue82-fix-types.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact Hunter correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/hunterVerification.ts")
          text = path.read_text()

          old_import = 'import { shouldPromoteHunterResult } from "./intelligenceTrustPolicy";\n'
          new_import = (
              'import { shouldPromoteHunterResult } from "./intelligenceTrustPolicy";\n'
              'import { isExplicitlyNotCrmOrphan } from "./contactSlateTrustPolicy";\n'
          )
          if text.count(old_import) != 1:
              raise SystemExit("Hunter policy import anchor was not unique")
          text = text.replace(old_import, new_import, 1)

          old_guard = '  if (!(contact.crmOrphan === false || contact.crmOrphan === 0)) {\n'
          new_guard = '  if (!isExplicitlyNotCrmOrphan(contact.crmOrphan)) {\n'
          if text.count(old_guard) != 1:
              raise SystemExit("Hunter orphan guard anchor was not unique")
          text = text.replace(old_guard, new_guard, 1)
          path.write_text(text)
          PY
      - name: Commit Hunter correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/hunterVerification.ts
          git commit -m "fix(issue82): normalise Hunter orphan state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
