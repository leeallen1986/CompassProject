name: Apply Issue 82 Apollo writer boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/issue82-apollo-patch-runner.yml"
      - ".github/workflows/issue82-apply-apollo-boundary.yml"
      - "server/contactTrustPromotionBoundary.ts"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact Apollo boundary patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/issue82-apply-apollo-boundary.yml").read_text().splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index("          PY", start)
          script_lines = source[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines)
          scope: dict[str, object] = {}
          try:
              exec(compile(script, "issue82-apollo-patch.py", "exec"), scope)
          except SystemExit as exc:
              expected = "reveal returned email: expected exactly one match, found 2"
              if str(exc) != expected:
                  raise

              text = scope.get("text")
              if not isinstance(text, str):
                  raise SystemExit("Apollo patch scope did not retain transformed source")

              def replace_last(source_text: str, old: str, new: str, label: str) -> str:
                  index = source_text.rfind(old)
                  if index < 0:
                      raise SystemExit(f"{label}: line was not found")
                  return source_text[:index] + new + source_text[index + len(old):]

              text = replace_last(
                  text,
                  '      email: p.email || null,\n',
                  '      email: nextEmail,\n',
                  "reveal returned email",
              )
              text = replace_last(
                  text,
                  '      hasEmail: !!p.email,\n',
                  '      hasEmail: Boolean(nextEmail),\n',
                  "reveal returned email flag",
              )

              old_orphan = '          AND (c.crmOrphan IS NULL OR c.crmOrphan = 0)\n'
              count = text.count(old_orphan)
              if count != 1:
                  raise SystemExit(f"manual pass explicit non-orphan: expected exactly one match, found {count}")
              text = text.replace(old_orphan, '          AND c.crmOrphan = 0\n', 1)

              Path("server/apolloEnrichment.ts").write_text(text)
          PY
      - name: Commit patched Apollo writer
        shell: bash
        run: |
          if git diff --quiet -- server/apolloEnrichment.ts; then
            echo "Apollo writer already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/apolloEnrichment.ts
          git commit -m "fix(issue82): gate Apollo writers on canonical trust evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
