name: Controller Issue 104 patch

on:
  push:
    branches:
      - controller/issue104-pipeline-reliability
    paths:
      - ".github/workflows/controller-issue104-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/issue104-pipeline-reliability
          fetch-depth: 0
      - name: Apply exact controller patch
        run: python .github/controller/issue104_patch.py
      - name: Verify patch
        run: |
          git diff --check
          git diff -- server/dailyPipeline.ts
      - name: Commit exact patch
        run: |
          git config user.name "controller-issue104"
          git config user.email "actions@users.noreply.github.com"
          git add server/dailyPipeline.ts
          git commit -m "fix(issue104): bound cron runtime and isolate contractor engine"
          git push origin HEAD:controller/issue104-pipeline-reliability
