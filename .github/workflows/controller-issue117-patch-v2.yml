name: Controller Issue 117 patch v2

on:
  push:
    branches:
      - controller/issue117-ai-extraction-provider
    paths:
      - ".github/workflows/controller-issue117-patch-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/issue117-ai-extraction-provider
          fetch-depth: 0
      - name: Apply corrected controller provider patch
        run: python .github/controller/issue117_patch_v2.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name "controller-issue117"
          git config user.email "actions@users.noreply.github.com"
          git add server/aiExtractor.ts server/dailyPipeline.ts server/aiExtractionHealth.test.ts server/aiExtractionPipelineIntegration.test.ts
          git commit -m "feat(issue117): persist provider attribution through extraction"
          git push origin HEAD:controller/issue117-ai-extraction-provider
