name: Rental account relationship reconciliation validation

on:
  pull_request:
    paths:
      - "server/rentalAccountRelationshipReconciliation.shared.ts"
      - "server/rentalAccountRelationshipReconciliation.ts"
      - "server/rentalAccountRelationshipReconciliation.test.ts"
      - "server/scripts/rentalAccountRelationshipReconcile.ts"
      - "docs/rental-account-relationship-reconciliation.md"
      - ".github/workflows/rental-account-relationship-reconciliation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm tsc --noEmit
      - name: Focused reconciliation tests
        run: >-
          pnpm vitest run
          server/rentalAccountRelationshipReconciliation.test.ts
          server/fullPotentialRentalWorkspacePolicy.test.ts
          server/fullPotentialRentalCanonicalWorkspace.test.ts
          server/fullPotentialRentalAuScope.test.ts
          server/fullPotentialRentalHire.test.ts
          server/fullPotentialRentalRemediation.test.ts
          server/fullPotentialRentalRemediation.handler.test.ts
      - name: CLI help is database-free
        run: pnpm exec tsx server/scripts/rentalAccountRelationshipReconcile.ts --help
      - name: Production build
        run: pnpm build
      - name: No schema or migration change
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -n "$base" ] && [ -n "$head" ]; then
            changed="$(git diff --name-only "$base" "$head")"
            if printf '%s\n' "$changed" | grep -Eq '(^drizzle/schema\.ts$|^drizzle/.*\.sql$|^migrations/)'; then
              echo "Schema or migration change detected"
              exit 1
            fi
          fi
