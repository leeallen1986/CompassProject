name: Issue 122 worker validation resilience

on:
  pull_request:
    paths:
      - ".github/workflows/issue122-worker-validation.yml"
      - "scripts/worker-validation-job.mjs"
      - "scripts/worker-validation-job.test.mjs"
      - "scripts/cloud-pipeline-release-manifest.mjs"
      - "docs/WORKER-CONTROL-CHANNEL.md"
      - ".github/workflows/issue-82-cloud-pipeline-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Node syntax
        run: |
          node --check scripts/worker-validation-job.mjs
          node --check scripts/worker-validation-job.test.mjs

      - name: Detached resume and fail-closed tests
        run: node scripts/worker-validation-job.test.mjs

      - name: Static safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Only fixed offline/static validation profiles are accepted' scripts/worker-validation-job.mjs
          grep -F 'args: ["-n", "run-pipeline.sh"]' scripts/worker-validation-job.mjs
          if grep -nE 'runDailyPipeline\(|pipeline-runner\.ts.*spawn|run-pipeline\.sh[[:space:]]+(cron|recover)' scripts/worker-validation-job.mjs; then
            echo "Validation controller appears able to invoke production pipeline/recovery." >&2
            exit 1
          fi
          if grep -nE 'readFileSync\([^\n]*\.env|AI_EXTRACTION_API_KEY|DATABASE_URL' scripts/worker-validation-job.mjs; then
            echo "Validation controller must not read or name production secrets." >&2
            exit 1
          fi

      - name: Runbook control-plane separation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'A disconnected terminal or Manus control session is **not** evidence' docs/WORKER-CONTROL-CHANNEL.md
          grep -F 'Do not restart the worker merely to regain terminal access.' docs/WORKER-CONTROL-CHANNEL.md
          grep -F 'incomplete` is fail-closed' docs/WORKER-CONTROL-CHANNEL.md
          grep -F 'provenanceStable=true' docs/WORKER-CONTROL-CHANNEL.md
