name: Issue 145 Full Potential governance-delta recovery

on:
  pull_request:
    paths:
      - ".github/workflows/issue145-governance-delta-recovery.yml"
      - "docs/full-potential-governance-delta-recovery.md"
      - "scripts/full-potential-governance-delta-recovery.ts"
      - "server/fullPotentialGovernanceDeltaRecovery.ts"
      - "server/fullPotentialGovernanceDeltaRecovery.private.ts"
      - "server/fullPotentialGovernanceDeltaRecovery.profile.ts"
      - "server/fullPotentialGovernanceDeltaRecovery.test.ts"
      - "server/fullPotentialLookalikeIdentityReconciliation.ts"
      - "server/fullPotentialLookalikeIdentityReconciliation.test.ts"
      - "server/fullPotentialLookalikePublicPack.ts"
      - "shared/fullPotentialAccountReconciliation.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Protect migration, database and weekly runtime boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'drizzle/**' \
            drizzle.config.ts \
            drizzle/fullPotentialSchema.ts \
            client/src/pages/ThisWeek.tsx \
            server/routers.ts \
            server/db.ts \
            pipeline-runner.ts \
            run-pipeline.sh; then
            echo "Issue #145 must remain migration-neutral, database-disconnected and weekly-runtime-disconnected." >&2
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- \
              'drizzle/**' drizzle.config.ts drizzle/fullPotentialSchema.ts \
              client/src/pages/ThisWeek.tsx server/routers.ts server/db.ts \
              pipeline-runner.ts run-pipeline.sh
            exit 1
          fi

      - name: Focused recovery and Issue 143 regressions
        run: >-
          pnpm exec vitest run
          server/fullPotentialGovernanceDeltaRecovery.test.ts
          server/fullPotentialLookalikeIdentityReconciliation.test.ts
          server/fullPotentialLookalikeDiscovery.test.ts
          server/fullPotentialAccountReconciliation.test.ts

      - name: CLI and static safety boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/full-potential-governance-delta-recovery.ts --help \
            | tee "$RUNNER_TEMP/issue145-help.txt"
          grep -F -- '--retained-post-apply-evidence-at' "$RUNNER_TEMP/issue145-help.txt"
          grep -F 'fully offline' "$RUNNER_TEMP/issue145-help.txt"

          grep -F 'originalDeltaRecovered: false' server/fullPotentialGovernanceDeltaRecovery.profile.ts
          grep -F 'exactTransactionTimeClaimed: false' server/fullPotentialGovernanceDeltaRecovery.profile.ts
          grep -F 'orphanAliasTargets: 0' server/fullPotentialGovernanceDeltaRecovery.profile.ts
          grep -F 'accountDeleted: 0' server/fullPotentialGovernanceDeltaRecovery.profile.ts
          grep -F 'weeklyRecommendationEligibleCount: 0' server/fullPotentialGovernanceDeltaRecovery.profile.ts
          grep -F 'RECOVERY_OUTPUT_INSIDE_REPOSITORY_REJECTED' scripts/full-potential-governance-delta-recovery.ts
          grep -F 'full-potential-governance-delta.recovered.json' scripts/full-potential-governance-delta-recovery.ts
          grep -F 'originalDeltaRecovered = false' docs/full-potential-governance-delta-recovery.md
          grep -F 'exactTransactionTimeClaimed = false' docs/full-potential-governance-delta-recovery.md

          if grep -nE 'getDb\(|DATABASE_URL|createConnection|createPool|runDailyPipeline|runWeeklyPipeline|apolloPeopleSearch|openai|gemini|lusha' \
            server/fullPotentialGovernanceDeltaRecovery.ts \
            server/fullPotentialGovernanceDeltaRecovery.private.ts \
            server/fullPotentialGovernanceDeltaRecovery.profile.ts \
            scripts/full-potential-governance-delta-recovery.ts; then
            echo "Issue #145 must not connect to production data, providers or pipelines." >&2
            exit 1
          fi

      - name: TypeScript
        run: pnpm check

      - name: Production build
        run: pnpm build
