name: Controller Issue 113 patch

on:
  push:
    branches:
      - controller/issue113-ai-extraction-outage
    paths:
      - ".github/workflows/controller-issue113-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/issue113-ai-extraction-outage
          fetch-depth: 0
      - name: Apply exact controller patch
        run: python .github/controller/issue113_patch.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit exact patch
        run: |
          git config user.name "controller-issue113"
          git config user.email "actions@users.noreply.github.com"
          git add server/aiExtractor.ts server/dailyPipeline.ts
          git commit -m "fix(issue113): fail closed on AI extraction outages"
          git push origin HEAD:controller/issue113-ai-extraction-outage
