name: Issue 115 self-healing truth

on:
  pull_request:
    paths:
      - ".github/workflows/issue115-self-healing-truth.yml"
      - "server/operationsReliabilityV2.ts"
      - "server/operationsReliabilityV2.issue115.test.ts"
      - "server/selfHealingRetryTruth.ts"
      - "server/selfHealingRetryTruth.test.ts"
      - "server/pipelineRunReliability.ts"
      - "server/pipelineRunReliability.test.ts"
      - "server/pipelineRuntimePolicy.ts"
      - "server/pipelineRuntimePolicy.test.ts"
      - "server/pipelineRuntimeIntegration.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Issue 115 focused and reliability regression tests
        run: >-
          pnpm exec vitest run
          server/selfHealingRetryTruth.test.ts
          server/operationsReliabilityV2.issue115.test.ts
          server/pipelineRunReliability.test.ts
          server/pipelineRuntimePolicy.test.ts
          server/pipelineRuntimeIntegration.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Production build
        run: pnpm build
