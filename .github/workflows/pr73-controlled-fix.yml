name: PR73 controlled source correction

on:
  push:
    branches:
      - fix/rental-coverage-canonical-parent-accuracy
    paths:
      - '.github/workflows/pr73-controlled-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr73-controlled-fix
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rental-coverage-canonical-parent-accuracy
          fetch-depth: 0
      - name: Apply exact controlled corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          canonical = Path('server/fullPotentialRentalCoverageCanonical.ts')
          text = canonical.read_text()
          old = '  return candidates.map(candidate => {'
          new = '  return candidates.map<CanonicalRentalCandidateResult>(candidate => {'
          if text.count(old) != 1:
              raise SystemExit(f'candidate map anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '    const structuralGaps = members.flatMap(member => preliminaryRows.get(member.id)?.rowGapCodes || []);'
          new = '''    const structuralGaps = members
      .flatMap(member => preliminaryRows.get(member.id)?.rowGapCodes || [])
      .filter(gap => [
        "relationship_cycle",
        "missing_relationship_target",
        "child_without_parent",
        "duplicate_counts_toward_potential",
        "inactive_counts_toward_potential",
      ].includes(gap));'''
          if text.count(old) != 1:
              raise SystemExit(f'structural gap anchor count={text.count(old)}')
          text = text.replace(old, new)
          canonical.write_text(text)

          tests = Path('server/fullPotentialRentalCoverageCanonical.test.ts')
          text = tests.read_text()
          old = '          ownerName: "Paul Lueth",\n          expectedOwnerNames: ["Paul Lueth"],'
          new = '          ownerName: "Paul Lueth",\n          expectedOwnerNames: ["Paul Lueth"],\n          routeToMarket: "cea",\n          channelOwner: "CEA",'
          if text.count(old) != 1:
              raise SystemExit(f'route conflict anchor count={text.count(old)}')
          tests.write_text(text.replace(old, new))
          PY

          git diff --check
          git diff --exit-code -- .github/workflows/pr73-controlled-fix.yml
      - name: Commit controlled corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI engineering controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/fullPotentialRentalCoverageCanonical.ts server/fullPotentialRentalCoverageCanonical.test.ts
          git commit -m 'fix(fp): correct canonical Rental census semantics'
          git push origin HEAD:fix/rental-coverage-canonical-parent-accuracy
