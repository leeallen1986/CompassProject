name: Issue 130 direct-mining Full Potential evidence

on:
  pull_request:
    paths:
      - ".github/workflows/issue130-direct-mining-evidence.yml"
      - "server/fullPotentialToughStationaryDirectMiningCore.ts"
      - "server/fullPotentialToughStationaryDirectMiningCore.test.ts"
      - "shared/fullPotentialRestrictedPlanningFactory.ts"
      - "server/fullPotentialRestrictedPlanningFactory.test.ts"
      - "shared/fullPotentialAccountReconciliation.ts"
      - "server/fullPotentialAccountReconciliation.test.ts"
      - "server/fullPotentialAccountReconciliationAllowance.test.ts"
      - "server/fullPotentialAccountReconciliationReport.ts"
      - "server/fullPotentialAccountReconciliationReport.test.ts"
      - "server/fullPotentialPublicImportManifest.ts"
      - "server/fullPotentialPublicImportManifest.test.ts"
      - "scripts/full-potential-meeting-pack.ts"
      - "scripts/full-potential-account-reconciliation.ts"
      - "docs/full-potential-meeting-pack.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused direct-mining regressions
        run: >-
          pnpm exec vitest run
          server/fullPotentialToughStationaryDirectMiningCore.test.ts
          server/fullPotentialRestrictedPlanningFactory.test.ts
          server/fullPotentialAccountReconciliation.test.ts
          server/fullPotentialAccountReconciliationAllowance.test.ts
          server/fullPotentialAccountReconciliationReport.test.ts
          server/fullPotentialPublicImportManifest.test.ts
          server/fullPotentialMeetingPack.test.ts

      - name: Public-evidence safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FP_TOUGH_STATIONARY_DIRECT_MINING_CORE_V1' server/fullPotentialToughStationaryDirectMiningCore.ts
          grep -F 'adoption hypotheses, not installed-base claims' server/fullPotentialToughStationaryDirectMiningCore.ts
          grep -F 'Conventional permanent compressor-room demand remains excluded' server/fullPotentialToughStationaryDirectMiningCore.ts
          grep -F 'directMiningPlanning' scripts/full-potential-meeting-pack.ts
          grep -F 'includedDirectMiningPlanning' scripts/full-potential-meeting-pack.ts
          grep -F 'include-direct-mining' scripts/full-potential-account-reconciliation.ts
          grep -F 'Unobserved allowance remains management-only' shared/fullPotentialAccountReconciliation.ts
          grep -F 'multipleDistinctPoolsPerBuyerAllowed' server/fullPotentialPublicImportManifest.ts
          grep -F 'unobservedAllowanceImportProposals: 0' server/fullPotentialPublicImportManifest.ts
          grep -F 'Optional direct-mining planning' docs/full-potential-meeting-pack.md
          if grep -nE 'averageSellingPriceAud|\bAUD\b|A\$[[:space:]]*[0-9]|\$[[:space:]]*[0-9]' server/fullPotentialToughStationaryDirectMiningCore.ts; then
            echo "Direct-mining public evidence must not contain restricted planning values." >&2
            exit 1
          fi
          if grep -niE 'customer said|customer told|purchasing intent|intends? to buy|agreed to buy|quotation price|discount' server/fullPotentialToughStationaryDirectMiningCore.ts; then
            echo "Direct-mining public evidence contains CRM/confidential language." >&2
            exit 1
          fi

      - name: Offline meeting pack with direct-mining planning
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/full-potential-direct-ci.json <<'JSON'
          {
            "rentalPlanning": {
              "planningValueSetRef": "ci-rental-planning-v1",
              "averageSellingPriceAud": 1000,
              "addressableSharePct": 100,
              "planningValueBasis": "blended_portfolio",
              "localisationUpliftStatus": "not_applicable",
              "overrides": []
            },
            "toughStationaryPlanning": {
              "planningValueSetRef": "ci-specialist-ts-planning-v1",
              "adoptionPositions": { "low": 1, "base": 2, "high": 3 },
              "averageSellingPriceAud": { "low": 1800, "base": 2000, "high": 2200 },
              "addressableSharePct": { "low": 50, "base": 60, "high": 70 },
              "planningValueBasis": "machine_only",
              "localisationUpliftStatus": "excluded_tbc",
              "overrides": [
                {
                  "recordKey": "allowance:ts4:direct-powered-projects",
                  "adoptionPositions": { "low": 1, "base": 4, "high": 8 }
                }
              ]
            },
            "directMiningPlanning": {
              "planningValueSetRef": "ci-direct-mining-planning-v1",
              "adoptionPositions": { "low": 0, "base": 1, "high": 2 },
              "averageSellingPriceAud": { "low": 1800, "base": 2000, "high": 2200 },
              "addressableSharePct": { "low": 30, "base": 50, "high": 70 },
              "planningValueBasis": "machine_only",
              "localisationUpliftStatus": "excluded_tbc",
              "overrides": [
                {
                  "recordKey": "mining:newmont:tanami-ts3-direct",
                  "adoptionPositions": { "low": 1, "base": 2, "high": 3 }
                }
              ]
            },
            "currentRevenueInputs": [],
            "readiness": {
              "expectedCurrentRevenueSegments": ["rental_hire", "mining_direct"],
              "planningStatus": "provisional",
              "localisationCostStatus": "tbc",
              "accountReconciliationStatus": "partial",
              "liveDeploymentRequired": false
            },
            "exportOptions": {
              "title": "CI Full Potential with direct mining",
              "asOfLabel": "Synthetic CI snapshot",
              "meetingDateLabel": "Synthetic review"
            },
            "generatedAt": "2026-08-21T00:00:00.000Z",
            "sourcePackRef": "ci-full-potential-direct-mining-v1"
          }
          JSON
          pnpm exec tsx scripts/full-potential-meeting-pack.ts \
            --input /tmp/full-potential-direct-ci.json \
            --check-only | tee /tmp/full-potential-direct-ci-result.json
          grep -F '"status": "PASS"' /tmp/full-potential-direct-ci-result.json
          grep -F '"includedToughStationaryBuyerPlanning": true' /tmp/full-potential-direct-ci-result.json
          grep -F '"includedDirectMiningPlanning": true' /tmp/full-potential-direct-ci-result.json
          grep -F '"publicObservationCount": 64' /tmp/full-potential-direct-ci-result.json
          grep -F '"restrictedPlanningCount": 43' /tmp/full-potential-direct-ci-result.json
          grep -F '"countingRecordCount": 43' /tmp/full-potential-direct-ci-result.json
          grep -F '"nonCountingRecordCount": 21' /tmp/full-potential-direct-ci-result.json
          grep -F '"namedQualificationContextCount": 9' /tmp/full-potential-direct-ci-result.json

      - name: Read-only reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/full-potential-empty-snapshot.json <<'JSON'
          {
            "snapshotRef": "ci-empty-direct-mining-snapshot-v1",
            "capturedAt": "2026-08-21T00:00:00.000Z",
            "accounts": [],
            "aliases": []
          }
          JSON
          pnpm exec tsx scripts/full-potential-account-reconciliation.ts \
            --input /tmp/full-potential-empty-snapshot.json \
            --check-only \
            --include-tough-stationary \
            --include-direct-mining | tee /tmp/full-potential-direct-reconciliation.json
          grep -F '"status": "INCOMPLETE"' /tmp/full-potential-direct-reconciliation.json
          grep -F '"includeToughStationary": true' /tmp/full-potential-direct-reconciliation.json
          grep -F '"includeDirectMining": true' /tmp/full-potential-direct-reconciliation.json
          grep -F '"publicRecordCount": 43' /tmp/full-potential-direct-reconciliation.json
          grep -F '"requiredBuyerIdentityCount": 34' /tmp/full-potential-direct-reconciliation.json
          grep -F '"unmatchedRecordCount": 42' /tmp/full-potential-direct-reconciliation.json
          grep -F '"managementOnlyRecordCount": 1' /tmp/full-potential-direct-reconciliation.json
          grep -F '"completeForDraftImport": false' /tmp/full-potential-direct-reconciliation.json

      - name: TypeScript
        run: pnpm check

      - name: Production build
        run: pnpm build
