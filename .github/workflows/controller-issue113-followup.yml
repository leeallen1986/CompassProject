name: Controller Issue 113 follow-up

on:
  push:
    branches:
      - controller/issue113-ai-extraction-outage
    paths:
      - ".github/workflows/controller-issue113-followup.yml"
      - ".github/controller/issue113_followup.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/issue113-ai-extraction-outage
          fetch-depth: 0
      - name: Apply controller follow-up
        run: python .github/controller/issue113_followup.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit follow-up
        run: |
          git config user.name "controller-issue113"
          git config user.email "actions@users.noreply.github.com"
          git add server/aiExtractionHealth.ts server/aiExtractionHealth.test.ts server/aiExtractor.ts
          git commit -m "fix(issue113): preserve attempt history and call truth"
          git push origin HEAD:controller/issue113-ai-extraction-outage
