name: Issue 86 Ryan buyer route

on:
  pull_request:
    paths:
      - ".github/scripts/verify-issue86-phase2a.mjs"
      - ".github/workflows/issue-86-ryan-buyer-route.yml"
      - "client/src/components/OutreachEmailModal.tsx"
      - "client/src/components/ProjectBuyerRoute.tsx"
      - "client/src/components/ProjectCard.issue86.static.test.ts"
      - "client/src/components/ProjectCard.test.ts"
      - "client/src/components/ProjectCard.tsx"
      - "client/src/components/outreachQuotaUx.static.test.ts"
      - "client/src/lib/outreachComposerState.test.ts"
      - "client/src/lib/outreachComposerState.ts"
      - "client/src/lib/projectBuyerRouteView.test.ts"
      - "client/src/lib/projectBuyerRouteView.ts"
      - "client/src/lib/projectOutreachEligibility.ts"
      - "client/src/pages/ProjectDetail.tsx"
      - "client/src/pages/ThisWeek.tsx"
      - "drizzle.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "drizzle/**"
      - "server/contactSlateTrustPolicy.ts"
      - "server/_core/llm.behavior.test.ts"
      - "server/_core/llmErrors.test.ts"
      - "server/_core/llmErrors.ts"
      - "server/_core/llm.ts"
      - "server/db.ts"
      - "server/emailDigest.ts"
      - "server/emailDigestContactProjection.issue86.test.ts"
      - "server/issue86Regression.static.test.ts"
      - "server/outreachContactProjection.ts"
      - "server/outreachDraftTelemetry.test.ts"
      - "server/outreachDraftTelemetry.ts"
      - "server/outreachEmail.ts"
      - "server/outreachEmail.quotaFallback.test.ts"
      - "server/outreachEmailFallback.test.ts"
      - "server/outreachEmailFallback.ts"
      - "server/outreachTemplates.quotaFallback.test.ts"
      - "server/outreachTemplates.ts"
      - "server/projectBuyerRoute.db.static.test.ts"
      - "server/projectBuyerRoute.router.test.ts"
      - "server/projectBuyerRoute.test.ts"
      - "server/projectBuyerRoute.ts"
      - "server/projectEvidenceMigration.issue86.test.ts"
      - "server/projectOutreachGuard.ts"
      - "server/routers.ts"
      - "server/thisWeekContactSelection.issue86.test.ts"
      - "server/thisWeekContactSelection.ts"
      - "server/thisWeekService.ts"
      - "vitest.issue86.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: issue86_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce Phase 2A additive migration boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS=$'\t' read -r status path extra; do
            [ -z "$status" ] && continue
            case "$status:$path" in
              M:drizzle/schema.ts|M:drizzle/meta/_journal.json)
                ;;
              A:drizzle/0091_issue86_buyer_route_evidence.sql|A:drizzle/meta/0091_snapshot.json)
                ;;
              *)
                echo "Unexpected migration change: $status $path ${extra:-}"
                failed=1
                ;;
            esac
          done < <(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'drizzle/**')

          for required in \
            drizzle/schema.ts \
            drizzle/meta/_journal.json \
            drizzle/0091_issue86_buyer_route_evidence.sql \
            drizzle/meta/0091_snapshot.json
          do
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'drizzle/**' |
              grep -Fxq "$required"; then
              echo "Required Phase 2A artifact is missing: $required"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - name: Validate generated Drizzle metadata
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/issue86_schema
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name issue86_phase2_drift
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain --untracked-files=all -- drizzle)"
      - name: Issue 86 focused tests
        run: pnpm test:issue86
      - name: Issue 85 trust-boundary regressions
        run: pnpm test:issue85
      - name: TypeScript
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Apply migrations to ephemeral MySQL
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/issue86_schema
        run: pnpm exec drizzle-kit migrate
      - name: Verify Phase 2A tables start empty
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/issue86_schema
        run: node .github/scripts/verify-issue86-phase2a.mjs
